name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install the development dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Lint
        working-directory: server
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: server
        run: mypy laya_serve

      - name: Test
        working-directory: server
        env:
          LAYA_SERVE_FAKE_MODEL: "1"
        run: pytest -q

      - name: Smoke test
        env:
          LAYA_SERVE_FAKE_MODEL: "1"
        run: ./scripts/smoke_test.sh

  swift:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build
        run: swift build --package-path app

      - name: Test
        run: swift test --package-path app

  app:
    name: Build the application
    runs-on: macos-26
    needs: [python, swift]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache the Python runtime download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/cache
          key: pbs-${{ hashFiles('scripts/build_runtime.sh') }}

      - name: Cache the model weights
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/model
          key: laya-model-typed-decisions-v1

      - name: Build the Python runtime
        run: ./scripts/build_runtime.sh

      - name: Fetch the model weights
        run: ./scripts/fetch_model.sh

      - name: Build the application
        run: ./scripts/build_app.sh

      - name: Smoke test with the bundled runtime
        run: ./scripts/smoke_test.sh

      - name: Classify with the real bundled model and no network access
        run: ./scripts/offline_test.sh

      - name: Package
        run: ./scripts/package.sh

      - name: Check that the application has no Dock icon
        run: |
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' build/LayaServe.app/Contents/Info.plist | grep -q true

      - name: Check that the weights are inside the application
        run: |
          test -f build/LayaServe.app/Contents/Resources/model/typed-decisions/model.safetensors

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: LayaServe-arm64
          path: build/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
