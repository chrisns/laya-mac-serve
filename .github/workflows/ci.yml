name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install the development dependencies
        run: pip install -r server/requirements-dev.txt

      - name: Lint
        working-directory: server
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: server
        run: mypy laya_serve

      - name: Test
        working-directory: server
        env:
          LAYA_SERVE_FAKE_MODEL: "1"
        run: pytest -q

      - name: Smoke test
        env:
          LAYA_SERVE_FAKE_MODEL: "1"
        run: ./scripts/smoke_test.sh

  swift:
    name: Swift tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --package-path app

      - name: Test
        run: swift test --package-path app

  app:
    name: Build the application
    runs-on: macos-15
    needs: [python, swift]
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Python runtime download
        uses: actions/cache@v4
        with:
          path: build/cache
          key: pbs-${{ hashFiles('scripts/build_runtime.sh') }}

      - name: Build the Python runtime
        run: ./scripts/build_runtime.sh

      - name: Build the application
        run: ./scripts/build_app.sh

      - name: Smoke test with the bundled runtime
        run: ./scripts/smoke_test.sh

      - name: Package
        run: ./scripts/package.sh

      - name: Check that the application has no Dock icon
        run: |
          /usr/libexec/PlistBuddy -c 'Print :LSUIElement' build/LayaServe.app/Contents/Info.plist | grep -q true

      - uses: actions/upload-artifact@v4
        with:
          name: LayaServe-arm64
          path: build/dist/*.dmg
          if-no-files-found: error
          retention-days: 14
