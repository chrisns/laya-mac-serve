name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Cache the Python runtime download
        uses: actions/cache@v4
        with:
          path: build/cache
          key: pbs-${{ hashFiles('scripts/build_runtime.sh') }}

      - name: Cache the model weights
        uses: actions/cache@v4
        with:
          path: build/model
          key: laya-model-typed-decisions-v1

      - name: Build the Python runtime
        run: ./scripts/build_runtime.sh

      - name: Fetch the model weights
        run: ./scripts/fetch_model.sh

      - name: Build the application
        run: ./scripts/build_app.sh

      - name: Smoke test with the bundled runtime
        run: ./scripts/smoke_test.sh

      - name: Classify with the real bundled model and no network access
        run: ./scripts/offline_test.sh

      - name: Check that the tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PLIST_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            app/Resources/Info.plist)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PLIST_VERSION" != "$TAG_VERSION" ]; then
            echo "The tag is $TAG_VERSION but Info.plist says $PLIST_VERSION." >&2
            exit 1
          fi

      - name: Package
        run: ./scripts/package.sh

      - name: Work out the checksum of the disk image
        id: sha256
        run: |
          DMG="$(ls build/dist/*.dmg)"
          echo "hash=$(shasum -a 256 "$DMG" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            app/Resources/Info.plist)" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          # Publish the disk image only. The zip holds the same application and it is
          # about 1 GB, so uploading both wastes time.
          files: build/dist/*.dmg
          generate_release_notes: true
          body: |
            ## Install

            Apple Silicon only. The application bundles its own Python, PyTorch and Laya.

            1. Open the disk image and drag `LayaServe.app` to Applications.
            2. The application is signed ad-hoc, not notarised. Remove the quarantine flag:

               ```bash
               xattr -dr com.apple.quarantine /Applications/LayaServe.app
               ```

            3. Start the application. It appears in the menu bar only.

            The weights ship inside the application, so it needs no network and no
            Hugging Face account. The first classification loads the model, which takes
            about 30 seconds. Later requests take about 40 ms.

            Point n8n at `http://127.0.0.1:5292/v1`. Read the README for the full setup.

            ## Homebrew

            ```bash
            brew install --cask --no-quarantine chrisns/laya-mac-serve/laya-serve
            ```

      - name: Update the Homebrew tap
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the tap stays as it is."
            echo "Create a token with the workflow scope for"
            echo "chrisns/homebrew-laya-mac-serve and add it as HOMEBREW_TAP_TOKEN."
            exit 0
          fi
          gh workflow run update.yml \
            --repo chrisns/homebrew-laya-mac-serve \
            --field version="${{ steps.sha256.outputs.version }}" \
            --field sha256="${{ steps.sha256.outputs.hash }}"
